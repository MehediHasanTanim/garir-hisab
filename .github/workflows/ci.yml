name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Golden images are OS-specific; run locally: flutter test --tags golden
      - run: flutter test --exclude-tags golden
      - name: Build release APK (prod, split per ABI)
        run: flutter build apk --release --flavor prod -t lib/main_prod.dart --split-per-abi
      - name: Enforce APK size budget (30 MB)
        run: |
          limit=$((30 * 1024 * 1024))
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt "$limit" ]; then echo "APK over 30 MB budget"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/app/outputs/flutter-apk/*-release.apk

  backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Apply migrations to staging
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          supabase link --project-ref "$STAGING_PROJECT_REF"
          supabase db push
